# Core Android / Kotlin
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
ksp.useKSP2=true

# Performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true

# Gradle daemon memory. Gradle's own default (-Xmx512m) is too small for
# KMP + Compose, so this is a modest floor that most machines can afford.
# The Kotlin daemon inherits it, and worker count defaults to the CPU count.
#
# Tune memory and workers for your machine in ~/.gradle/gradle.properties,
# which overrides this file. Note that org.gradle.jvmargs there replaces this
# value outright, so carry over -Dfile.encoding=UTF-8.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8