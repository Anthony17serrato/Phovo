name: Build Kotlin Multiplatform

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:

# One run per PR: a new push cancels the PR's run that's still going, so the
# self-hosted runner doesn't spend time building commits that were replaced.
# Pushes to main, develop and release/* each get their own group (by commit),
# so a post-merge build is never cancelled by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compile-kmp:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create local.properties
        run: echo "sdk.dir=/Users/anthonyserrato/Library/Android/sdk" > local.properties
      # Currently Raspberry Pi cannot build WASM due to ARM64 issues https://youtrack.jetbrains.com/issue/KT-70100/wasmJs-Target-Fails-to-Compile-on-ARM64-Linux
      # - name: Yarn
      #  run: ./gradlew kotlinUpgradeYarnLock
      - name: Build Project
        run: ./gradlew build
      # build-logic is an included build, so the root build doesn't run its tests.
      - name: Test build logic
        run: ./gradlew -p build-logic test
#      - name: Compile Android
#        run: ./gradlew compileDebugKotlinAndroid
#      - name: Compile Web
#        run: ./gradlew compileKotlinWasmJs
# Not sure this can be compiled on linux        
