<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phovo — Self-Hosted Photo & Video Cloud</title>
    <link rel="icon" type="image/webp" href="phovo_transparent_icon.webp">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0E1513;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #FFFFFF;
            touch-action: pan-x pan-y;
            -ms-touch-action: pan-x pan-y;
            overflow-x: hidden;
        }

        #ComposeTarget {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .in-app-notice {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 99999;
            background-color: #0E1513;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .notice-card {
            background-color: #141D1A;
            border: 1px solid #83D5C6;
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            text-align: center;
        }

        .notice-badge {
            background-color: #1B2925;
            color: #9FF2E2;
            font-weight: 700;
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #83D5C6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .notice-title {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
            color: #FFFFFF;
        }

        .notice-desc {
            font-size: 14px;
            color: #BEC9C5;
            line-height: 1.5;
            margin: 0;
        }

        .notice-tip {
            font-size: 13px;
            color: #83D5C6;
            font-weight: 600;
            line-height: 1.4;
            margin: 0;
            background-color: #1B2925;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(131, 213, 198, 0.2);
        }

        .spinner-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- In-App Browser Detection Overlay -->
    <div id="inAppNotice" class="in-app-notice">
        <div class="notice-card">
            <img src="phovo_transparent_icon.webp" width="80" height="80" alt="Phovo Logo">
            <div class="notice-badge">In-App Browser Detected</div>
            <h2 class="notice-title">Open in Safari or Chrome</h2>
            <p class="notice-desc">
                For optimal performance and full interactive features, please open Phovo in your device's native browser.
            </p>
            <div class="notice-tip">
                Tap the <strong>•••</strong> menu at the top right or bottom corner and select <strong>"Open in Browser"</strong>.
            </div>
        </div>
    </div>

    <!-- Spinner -->
    <div id="loadingSpinner" class="spinner-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
            <circle cx="25" cy="25" r="20" stroke="#006B5F" stroke-width="4" fill="none"/>
            <circle cx="25" cy="25" r="20" stroke="#83D5C6" stroke-width="4" fill="none" stroke-linecap="round"
                    stroke-dasharray="90 125">
                <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                                   repeatCount="indefinite"/>
            </circle>
        </svg>
    </div>

    <!-- Container element for Compose Viewport -->
    <div id="ComposeTarget"></div>

    <script type="application/javascript">
        function isInAppBrowser() {
            var ua = navigator.userAgent || navigator.vendor || window.opera || "";
            return /Instagram|FBAN|FBAV|TikTok|LinkedInApp|Snapchat|MicroMessenger|Pinterest/i.test(ua);
        }

        if (isInAppBrowser()) {
            var spinner = document.getElementById('loadingSpinner');
            if (spinner) spinner.remove();
            document.getElementById('inAppNotice').style.display = 'flex';
        } else {
            var script = document.createElement('script');
            script.type = 'application/javascript';
            // Force cache busting timestamp to bypass Safari stale cache
            script.src = 'webLandingPage.js?v=' + Date.now();
            script.onload = function() {
                var spinner = document.getElementById('loadingSpinner');
                if (spinner) spinner.remove();
            };
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
